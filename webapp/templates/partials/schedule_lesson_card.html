<template id="lesson-template">
    <div class="lesson-card">
        <div class="lesson-card-info">
            <div class="lesson-card-hat">
                <span class="lesson-card-time"></span>
                <span class="lesson-card-audience"></span>
            </div>
            <div class="lesson-card-description">
                <span class="lesson-card-name"></span>
                <span class="lesson-card-type"></span>
            </div>
            <span class="lesson-card-teachers"></span>
            <span class="lesson-card-homework hidden"></span>
        </div>
        <div class="lesson-card-break">
            <p class="lesson-card-break-text"></p>
        </div>
    </div>
</template>
