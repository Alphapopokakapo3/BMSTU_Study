    <style>

        body {
            overflow: hidden;
        }


        #weeks-viewport {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            

            scrollbar-width: none;
            
            touch-action: pan-x;
            overscroll-behavior-x: contain;
        }

        .slide {
            flex: 0 0 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        #schedule-page-head {
            margin-left: 24px;
            margin-right: 24px;

            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        #schedule-page-label {
            font-family: 'Nunito Bold';
            font-size: 20px;
            color: var(--text-first);
        }

        #week-number-button {
            font-family: 'Nunito SemiBold';
            font-size: 16px;
            color: white;
            height: 32px;

            background-color: var(--primary);
            border: none;
            padding: 2px 8px;
            border-radius: 8px;

        }

        #month-name-button {
            font-family: 'Nunito SemiBold';
            font-size: 16px;
            color: white;
            height: 32px;

            background-color: var(--primary);
            border: none;
            padding: 2px 8px;
            border-radius: 8px;
        }

        .vertical-schedule-viewport {
            display: flex;
            flex-direction: column;
            height: 100%;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;

            touch-action: pan-y;
            overscroll-behavior-y: contain;

            scrollbar-width: none;
        }

        #horizontal-schedule-viewport {
            flex: 1;
            min-height: 0;
            height: 100%;
        }

        .lesson-card {
            scroll-snap-align: start;
        }

        #schedule-page-content {
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
        }

        
        

    </style>

</head>

        function setSchedulePageInfo(data) {
            document.getElementById("week-number-button").textContent = data.weekNumberText;

        function generateScheduleViewport(data) {

        // horizontal_schedule_viewport.append(generateScheduleViewport([lessonTest,lessonTest,lessonTest,lessonTest,lessonTest,lessonTest]));

        async function getScheduleFromApi() {
            const res = await fetch('api/schedule');
            const data = await res.json();

            let ch_week_data = [];
            let zn_week_data = [];

            data.schedule.forEach(element => {
                if (element.week == "ch") {
                    ch_week_data.push(element);
                }
                else if (element.week == "zn") {
                    zn_week_data.push(element);
                }
                else if (element.week == "all") {
                    ch_week_data.push(element);
                    zn_week_data.push(element);
                }
            });

            return {
                ch: ch_week_data,
                zn: zn_week_data
            };
        }

        function scheduleViewModelFromScheduleData(data, currentTime, breakTime, homeworkText) { // currentTime (mins), breakTime (mins, -1 last)
            let viewModel = {};

            viewModel.day = data.day;
            viewModel.week = data.week;

            viewModel.time = data.startTime + " - " + data.endTime;

            let audiences = []
            data.audiences.forEach( element => {
                audiences.push(element.name);
            })
            viewModel.audience = audiences.join(", ");

            viewModel.name = data.discipline.fullName;

            viewModel.type = data.discipline.actType;
            switch (viewModel.type) {
                case "lab":
                    viewModel.typeText = "лаб. работа";
                    break;
                case "seminar":
                    viewModel.typeText = "семинар";
                    break;
                case "lecture":
                    viewModel.typeText = "лекция";
                    break;
            }

            let teachers = []
            data.teachers.forEach(el => {
                teachers.push([el.lastName, el.firstName, el.middleName].join(" "));
            })
            viewModel.teachersText = teachers.join(", ");

            viewModel.homeworkText = homeworkText;
            if (homeworkText == "") {
                viewModel.isHomework = false;
            } else {
                viewModel.isHomework = true;
            }

            viewModel.breakText = `Перерыв ${breakTime} мин.`

            let isActive = false;
            let isBreak = false;
            let isLast = false;

            let startMinutes = data.startTimeHourNum * 60 + data.startTimeMinNum;
            let endMinutes = data.endTimeHourNum * 60 + data.endTimeMinNum;

            isLast = breakTime == -1;
            isActive = (currentTime >= startMinutes) && (currentTime < endMinutes);
            if (!isLast) {
                isBreak = (currentTime >= endMinutes) && (currentTime < endMinutes + breakTime);
            }

            viewModel.isActive = isActive;
            viewModel.isLast = isLast;
            viewModel.isBreak = isBreak;

            return viewModel;
            
        }

        function getSortedDaysDataWithCalculatedData(data) {
            let week = { // списки занятий
                1: [],
                2: [],
                3: [],
                4: [],
                5: [],
                6: [],
                7: []
            };

            let breaks = { // списки перерывов между занятиями
                1: [],
                2: [],
                3: [],
                4: [],
                5: [],
                6: [],
                7: []
            };

            data.forEach(el => {
                const day = el.day;

                if (week[day].length > 0) {
                    const last = week[day].at(-1);

                    const lastEnd = last.endTimeHourNum * 60 + last.endTimeMinNum;
                    const curStart = el.startTimeHourNum * 60 + el.startTimeMinNum;

                    const breakTime = curStart-lastEnd;

                    breaks[day].push(breakTime);
                }
                week[day].push(el);
            });
            Object.entries(breaks).forEach(element => {
                breaks[element[0]].push(-1);
            })

            return {
                week: week,
                breaks: breaks
            }
        }

        async function main() {
            const schedule = await getScheduleFromApi();
            // console.log(schedule.ch);
            // console.log(schedule.zn);

            
            let day = [];

            const sortedCh = getSortedDaysDataWithCalculatedData(schedule.ch);
            console.log(sortedCh);
            Object.entries(sortedCh.week).forEach(value => {
                let key = value[0];
                let lesson_number = 0;
                value[1].forEach(lesson => {
                    // console.log(lesson);
                    day.push(
                        scheduleViewModelFromScheduleData(lesson, 780, sortedCh.breaks[key][lesson_number], "")
                        
                    );
                    lesson_number += 1;
                })
                horizontal_schedule_viewport.append(generateScheduleViewport(day));
                day = [];
            });

            // console.log(getSortedDaysDataWithCalculatedData(schedule.ch));



            
            
        }

        main();
